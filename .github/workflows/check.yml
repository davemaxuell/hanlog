name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types, lint, and tests
        run: npm run check

      - name: Build production application with mock scoring
        run: npm run build
        env:
          OPENAI_API_KEY: ''
          SCORING_PROVIDER: mock
          SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          CRON_SECRET: ci-only-cron-secret
          PGLITE_DIR: memory://

      - name: Check client bundle and tracked files
        run: npm run check:bundle
